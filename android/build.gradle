// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // GRIM_HC_CLIENT_GUARD: bygget ska hellre misslyckas än att en gammal
    // Health Connect-klient (t.ex. 1.2.0-alpha01) smyger in transitivt.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.health.connect' &&
                details.requested.name == 'connect-client' &&
                details.requested.version != null &&
                details.requested.version != '1.2.0-alpha06') {
                throw new GradleException("GRIM_HC: connect-client ${details.requested.version} begärdes av ${project.path}; endast 1.2.0-alpha06 är tillåten.")
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
