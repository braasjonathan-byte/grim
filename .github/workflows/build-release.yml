name: Build Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "Error: ANDROID_KEYSTORE_BASE64 secret is not set!"
          exit 1
        fi
        # Vi rensar bort ALLA typer av whitespace och ignorerar skräptecken vid avkodning
        echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -di > android/app/min-app-nyckel.jks
        
        # Kontrollera att filen faktiskt skapades och inte är tom
        if [ ! -s android/app/min-app-nyckel.jks ]; then
          echo "Error: Keystore file is empty after decoding. Base64 input might be invalid."
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build with Gradle
      run: |
        cd android
        ./gradlew assembleRelease
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/*.apk
