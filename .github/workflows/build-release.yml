name: Build Stable Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        # Vi använder Python för att rensa bort precis allt skräp och avkoda säkert
        python3 -c "import base64, os, re; data = os.environ.get('KEYSTORE_BASE64', ''); data = re.sub(r'[^A-Za-z0-9+/=]', '', data); open('android/app/min-app-nyckel.jks', 'wb').write(base64.b64decode(data))"
        
        if [ ! -s android/app/min-app-nyckel.jks ]; then
          echo "Error: Keystore file is empty after decoding. Check your GitHub Secret!"
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 7
