name: Build Stable Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Patch send-intent plugin gradle (Capacitor 8 compat)
      run: node scripts/patch-send-intent-gradle.cjs

    - name: Patch capacitor-health (sleep support)
      run: node scripts/patch-capacitor-health.cjs

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Patch AndroidManifest (permissions, Health Connect)
      run: node scripts/patch-android-manifest.cjs

    - name: Patch Android system insets
      run: node scripts/patch-android-system-insets.cjs

    - name: Verify Android plugins (Health Connect config)
      run: node scripts/verify-android-plugins.cjs

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "Error: ANDROID_KEYSTORE_BASE64 secret is not set!"
          exit 1
        fi
        python3 -c "import base64, os, re; data = os.environ.get('KEYSTORE_BASE64', ''); data = re.sub(r'[^A-Za-z0-9+/=]', '', data); open('android/app/min-app-nyckel.jks', 'wb').write(base64.b64decode(data))"
        
        if [ ! -s android/app/min-app-nyckel.jks ]; then
          echo "Error: Keystore file is empty after decoding."
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: release-apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 3

