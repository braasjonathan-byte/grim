name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      VITE_APK_UPDATE_URL: "https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'tools platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Force JAVA_HOME to JDK 21
        run: |
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> $GITHUB_ENV
          echo "ORG_GRADLE_PROJECT_org.gradle.java.home=${{ steps.setup-java.outputs.path }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy google-services.json into Android app
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "✅ google-services.json copied to android/app/"
          else
            echo "::warning::google-services.json not found — native push will not work"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch AndroidManifest.xml with required permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          needed = [
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_BACKGROUND_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.INTERNET',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_LOCATION',
              'android.permission.WAKE_LOCK',
          ]
          insert = ""
          for perm in needed:
              if perm not in s:
                  insert += f'    <uses-permission android:name="{perm}" />\n'
          if insert:
              s = re.sub(r'(</manifest>)', insert + r'\1', s, count=1)
              p.write_text(s)
              print("✅ Patched manifest with:", insert)
          else:
              print("✅ All required permissions already present")
          PY

      - name: Decode keystore (if provided)
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "keystore_present=true" >> $GITHUB_OUTPUT

      - name: Configure signing in build.gradle
        if: steps.keystore.outputs.keystore_present == 'true'
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 <<'PY'
          import os, pathlib, re
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs" in s and "release {" in s and "release.keystore" in s:
              print("Signing config already present")
          else:
              signing = f'''
    signingConfigs {{
        release {{
            storeFile file("release.keystore")
            storePassword "{os.environ['KEYSTORE_PASSWORD']}"
            keyAlias "{os.environ['KEY_ALIAS']}"
            keyPassword "{os.environ['KEY_PASSWORD']}"
        }}
    }}
'''
              s = re.sub(r'(android\s*\{)', r'\1' + signing, s, count=1)
              s = re.sub(
                  r'buildTypes\s*\{\s*release\s*\{',
                  'buildTypes {\n        release {\n            signingConfig signingConfigs.release',
                  s, count=1
              )
              p.write_text(s)
              print("✅ Signing config injected")
          PY

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        id: apk
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace --warning-mode all -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Locate release APK
        id: locate
        run: |
          SIGNED=android/app/build/outputs/apk/release/app-release.apk
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$SIGNED" ]; then
            echo "apk_path=$SIGNED" >> $GITHUB_OUTPUT
            echo "apk_name=app-release.apk" >> $GITHUB_OUTPUT
          elif [ -f "$UNSIGNED" ]; then
            echo "apk_path=$UNSIGNED" >> $GITHUB_OUTPUT
            echo "apk_name=app-release-unsigned.apk" >> $GITHUB_OUTPUT
          else
            echo "::error::No release APK found"
            ls -R android/app/build/outputs/apk || true
            exit 1
          fi

      - name: Collect Gradle reports
        if: always()
        run: |
          mkdir -p _reports
          find android -path '*/build/reports' -type d -exec cp -r {} _reports/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-reports-release
          path: _reports
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: grim-release-apk
          path: ${{ steps.locate.outputs.apk_path }}

      - name: Publish GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Grim release ${{ github.run_number }}
          files: ${{ steps.locate.outputs.apk_path }}
          make_latest: "true"
          generate_release_notes: true
