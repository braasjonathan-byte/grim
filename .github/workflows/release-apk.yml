name: Capacitor Android Build (Production Stable)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # Node
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # -------------------------
      # Java
      # -------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # -------------------------
      # Clean install (IMPORTANT)
      # -------------------------
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # -------------------------
      # Build web
      # -------------------------
      - name: Build web
        run: npm run build

      # -------------------------
      # FORCE CLEAN (removes ALL Cordova remnants)
      # -------------------------
      - name: Clean everything
        run: |
          rm -rf android
          rm -rf node_modules/.cache

      # -------------------------
      # Install ONLY Capacitor (no Cordova dependency)
      # -------------------------
      - name: Install Capacitor core
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --no-audit --no-fund

      # -------------------------
      # Create Android project clean
      # -------------------------
      - name: Create Android platform
        run: npx cap add android

      # -------------------------
      # Copy google-services.json BEFORE sync so Firebase initializes
      # (push-notifications plugin crashes at startup without it)
      # -------------------------
      - name: Copy google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied to android/app/"
          else
            echo "ERROR: google-services.json missing in repo root"
            exit 1
          fi

      # -------------------------
      # Sync Capacitor (ONLY ONCE, CLEAN STATE)
      # -------------------------
      - name: Capacitor sync
        run: npx cap sync android

      # -------------------------
      # Patch Firebase / FCM after the clean Android project is generated
      # (copying google-services.json alone is not enough; Gradle must also
      # apply the Google Services plugin or native push can crash at startup)
      # -------------------------
      - name: Patch Firebase / FCM
        run: node scripts/patch-android-firebase.cjs

      # -------------------------
      # Patch AndroidManifest with required permissions
      # (location, notifications, bluetooth, camera, mlkit metadata)
      # -------------------------
      - name: Patch AndroidManifest
        run: node scripts/patch-android-manifest.cjs

      # -------------------------
      # Keystore
      # -------------------------
      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      # -------------------------
      # Signing (clean Gradle properties method)
      # -------------------------
      - name: Setup signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat >> android/gradle.properties <<EOF
RELEASE_STORE_FILE=release.keystore
RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
EOF

      # -------------------------
      # Make gradlew executable
      # -------------------------
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # -------------------------
      # Build APK
      # -------------------------
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # -------------------------
      # Find APK
      # -------------------------
      - name: Locate APK
        id: apk
        run: |
          APK=$(find android -name "*release*.apk" | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      # -------------------------
      # Upload artifact
      # -------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.apk.outputs.apk_path }}

      # -------------------------
      # GitHub Release
      # -------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
