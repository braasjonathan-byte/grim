name: Capacitor Android Build (AAB for Google Play)

on:
  workflow_dispatch:
  push:
    tags:
      - "aab-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Clean everything
        run: |
          rm -rf android
          rm -rf node_modules/.cache

      - name: Install Capacitor core
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android platform
        run: npx cap add android

      - name: Copy google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied to android/app/"
          else
            echo "ERROR: google-services.json missing in repo root"
            exit 1
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Patch Firebase / FCM
        run: node scripts/patch-android-firebase.cjs

      - name: Patch AndroidManifest
        run: node scripts/patch-android-manifest.cjs

      # -------------------------
      # Bump versionCode/versionName from the GitHub run number so each
      # upload to Google Play has a unique, monotonically increasing code.
      # Google Play rejects re-uploads of the same versionCode.
      # -------------------------
      - name: Bump version
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "Using versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Setup signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          {
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # -------------------------
      # Build AAB (Android App Bundle) — required format for Google Play
      # -------------------------
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find android -name "*release*.aab" | head -n 1)
          echo "aab_path=$AAB" >> $GITHUB_OUTPUT
          echo "Found AAB at: $AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ steps.aab.outputs.aab_path }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.aab.outputs.aab_path }}
          generate_release_notes: true
