name: Capacitor Android Build (AAB for Google Play)

on:
  workflow_dispatch:
  push:
    tags:
      - "aab-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Patch legacy send-intent plugin
        run: node scripts/patch-send-intent-gradle.cjs

      - name: Patch capacitor-health (sleep support)
        run: node scripts/patch-capacitor-health.cjs

      - name: Verify all Android plugins
        run: npm run android:verify-plugins

      - name: Build web
        env:
          VITE_ENABLE_NATIVE_PUSH: "true"
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Re-verify native plugins after sync
        run: npm run android:verify-plugins

      - name: Patch Firebase / FCM
        run: node scripts/patch-android-firebase.cjs

      - name: Patch AndroidManifest
        run: node scripts/patch-android-manifest.cjs

      - name: Patch Android system insets
        run: node scripts/patch-android-system-insets.cjs

      - name: Verify Android plugins (Health Connect config)
        run: node scripts/verify-android-plugins.cjs

      - name: Install Grim app icons
        run: node scripts/patch-android-icons.cjs

      - name: Write Android Developer Verification (adi-registration.properties)
        run: |
          mkdir -p android/app/src/main/assets
          echo "DIZW4P6VXCJBMAAAAAAAAAAAA" > android/app/src/main/assets/adi-registration.properties
          echo "adi-registration.properties written:"
          cat android/app/src/main/assets/adi-registration.properties

      # -------------------------
      # Bump versionCode/versionName from the GitHub run number so each
      # upload to Google Play has a unique, monotonically increasing code.
      # Google Play rejects re-uploads of the same versionCode.
      # -------------------------
      - name: Bump version
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "Using versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Print SHA-256 fingerprint
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          echo "=========================================="
          echo "SHA-256 fingerprint (use in Play Console):"
          echo "=========================================="
          keytool -list -v \
            -keystore /tmp/keystore.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:" || true
          rm -f /tmp/keystore.jks

      - name: Setup signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          {
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> android/gradle.properties

      - name: Patch build.gradle with signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: node scripts/patch-android-signing.cjs

      - name: Verify signing config in build.gradle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "--- android/app/build.gradle ---"
          cat android/app/build.gradle
          grep -q "signingConfig signingConfigs.release" android/app/build.gradle \
            || (echo "ERROR: release signingConfig not wired up" && exit 1)

      - name: Make gradlew executable
        run: chmod +x android/gradlew


      # -------------------------
      # Build AAB (Android App Bundle) — required format for Google Play
      # -------------------------
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --build-cache --parallel

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -maxdepth 1 -name "*.aab" -print -quit)
          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB was not generated"
            exit 1
          fi
          echo "aab_path=$AAB" >> $GITHUB_OUTPUT
          echo "Found AAB at: $AAB"

      - name: Locate mapping.txt (R8 deobfuscation)
        id: mapping
        run: |
          MAPPING=$(find android/app/build/outputs/mapping/release -name "mapping.txt" | head -n 1)
          echo "mapping_path=$MAPPING" >> $GITHUB_OUTPUT
          echo "Found mapping at: $MAPPING"

      - name: Locate native debug symbols
        id: symbols
        run: |
          SYMS=$(find android/app/build/outputs -name "native-debug-symbols.zip" | head -n 1)
          echo "symbols_path=$SYMS" >> $GITHUB_OUTPUT
          echo "Found symbols at: $SYMS"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-aab
          path: ${{ steps.aab.outputs.aab_path }}
          retention-days: 3

      - name: Upload mapping.txt artifact
        if: steps.mapping.outputs.mapping_path != ''
        uses: actions/upload-artifact@v5
        with:
          name: mapping
          path: ${{ steps.mapping.outputs.mapping_path }}
          retention-days: 3

      - name: Upload native debug symbols artifact
        if: steps.symbols.outputs.symbols_path != ''
        uses: actions/upload-artifact@v5
        with:
          name: native-debug-symbols
          path: ${{ steps.symbols.outputs.symbols_path }}
          retention-days: 3

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.aab.outputs.aab_path }}
            ${{ steps.mapping.outputs.mapping_path }}
            ${{ steps.symbols.outputs.symbols_path }}
          generate_release_notes: true

